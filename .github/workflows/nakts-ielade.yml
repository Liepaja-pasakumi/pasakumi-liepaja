# Katru nakti nolasa kalendars.liepaja.lv un ieraksta pasakumus Supabase.
# Var palaist ari ar roku: GitHub -> Actions -> "Nakts ielade" -> "Run workflow".
name: Nakts ielade

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00 Latvijas laika (ziema), 04:00 (vasara)
  workflow_dispatch:       # poga "Run workflow"

jobs:
  ielade:
    runs-on: windows-latest   # tas pats Windows PowerShell, kas datora - var parbaudit uz vietas
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Liepajas kalendars
        shell: powershell
        env:
          SUPABASE_URL: https://vajibazlcehbalkrkqfl.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: .\scraper\liepaja.ps1

      # LSSS pec Liepajas kalendara - lai dublikatus var atsijat pret jau ielasitajiem
      - name: LSSS kalendars
        if: always()
        shell: powershell
        env:
          SUPABASE_URL: https://vajibazlcehbalkrkqfl.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: .\scraper\lsss.ps1
